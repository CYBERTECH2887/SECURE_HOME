<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | SecureHome</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
        const savedTheme = localStorage.getItem('sh_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;">
    
    <div style="position: absolute; top: 30px; left: 40px; display: flex; gap: 15px; align-items: center;">
        <a class="brand" href="/"><span class="brand-icon">⌂</span> Secure<span>Home</span></a>
        <a href="/" class="btn btn-outline btn-small" style="font-size: 12px; padding: 6px 14px;">← Back to Home</a>
    </div>

    <div class="panel" style="width: 100%; max-width: 420px; padding: 40px; box-shadow: var(--shadow);">
        <div class="eyebrow">ADMINISTRATOR PORTAL</div>
        <h2>Workspace Login</h2>
        <p class="muted" style="margin-bottom: 25px;">Enter your credentials to access the security console.</p>
        
        <form method="POST" action="/login">
            <div class="field">
                <label>Username</label>
                <input name="username" required placeholder="Enter username">
            </div>
            
            <div class="field">
                <label>Password</label>
                <div style="position: relative;">
                    <input name="password" id="loginPassword" type="password" required placeholder="Enter password" style="width: 100%; padding-right: 40px;">
                    <button type="button" onclick="togglePassword('loginPassword', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted);">👁️</button>
                </div>
                <div style="text-align: right; margin-top: 5px;">
                    <a href="/forgot_password" style="font-size: 12px; color: var(--cyan); text-decoration: none;">Forgot Password?</a>
                </div>
            </div>
            
            <button class="btn btn-primary full" type="submit" style="margin-top: 15px; padding: 14px;">Access Workspace →</button>
            
            {% if error %}
                <p style="color: var(--red); text-align: center; margin-top: 15px; font-size: 13px;">{{ error }}</p>
            {% endif %}
        </form>

        <div style="text-align: center; margin-top: 25px; font-size: 13px; padding-top: 20px; border-top: 1px solid var(--line);">
            <span class="muted">Don't have a workspace?</span> 
            <a href="/register" style="color: var(--cyan); font-weight: 600; text-decoration: none;">Register now</a>
        </div>
    </div>

    <script>
        function togglePassword(fieldId, btn) {
            const field = document.getElementById(fieldId);
            if (field.type === 'password') {
                field.type = 'text';
                btn.textContent = '🙈';
            } else {
                field.type = 'password';
                btn.textContent = '👁️';
            }
        }
    </script>
</body>
</html>
