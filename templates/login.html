{% extends "auth_base.html" %}{% set title = "Log in" %}
{% block form %}
<h2>Log in to your workspace</h2><p class="muted lead">Use the username you registered with.</p>
{% if error %}<div class="flash bad" role="alert">{{ error }}</div>{% endif %}
<form method="POST" action="{{ url_for('login') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="field"><label for="u">Username</label><input id="u" name="username" required autocomplete="username" autofocus></div>
  <div class="field"><label for="p">Password</label>
    <div class="pw"><input id="p" name="password" type="password" required autocomplete="current-password"><button type="button" data-pw-toggle="p" aria-label="Show password"><svg class="i"><use href="#i-eye"/></svg></button></div>
    <p class="hint"><a href="{{ url_for('forgot_password') }}" style="color:var(--accent)">Forgot your password?</a></p></div>
  <button class="btn btn-primary btn-block" type="submit">Log in</button>
</form>
<p class="muted small" style="margin-top:22px;text-align:center">New here? <a href="{{ url_for('register') }}" style="color:var(--accent);font-weight:600">Create a workspace</a></p>
{% endblock %}
